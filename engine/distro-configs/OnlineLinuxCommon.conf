# Shared Linux configuration for the neutral Online source image.
--disable-dbus
--disable-dconf
--disable-evolution2
--disable-gio
--disable-gtk3
--disable-gui
--disable-librelogo
--disable-randr
--disable-xmlhelp

--enable-cairo-rgba
--enable-hardening-flags
--enable-ld
--enable-mergelibs
--enable-quickjs
--enable-symbols

--without-branding
--with-product-name=Online Office
--with-buildconfig-recorded
--with-docrepair-fonts
--with-fonts
--with-galleries=no
--with-linker-hash-style=both
--with-theme=colibre colibre_svg
--without-help
--without-junit
--with-system-dicts
--with-system-zlib
--without-system-cairo
--without-system-jpeg
--without-templates
